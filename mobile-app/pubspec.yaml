name: agri_platform_mobile
description: "Plateforme de Gestion Intégrée de l'Approvisionnement Agricole — Application Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # État
  provider: ^6.1.4
  # Réseau
  http: ^1.2.2
  # Stockage local (préférences, profil affiché hors ligne)
  shared_preferences: ^2.3.4
  # Stockage chiffré du jeton de session (Keychain iOS, Keystore Android)
  flutter_secure_storage: ^10.0.0
  # Formatage des dates
  intl: ^0.19.0
  # Géolocalisation (suivi GPS transporteur)
  geolocator: ^13.0.2
  # Bouton « Itinéraire » : ouvre la navigation (Google Maps) vers la prochaine adresse
  url_launcher: ^6.3.1
  # Lot 5 (Q13) : QR code du lot, affiché et scanné à la réception
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  # Lot 6 (Q15) : notifications sur téléphone. Configuration passée à la
  # construction (--dart-define FIREBASE_*) ; sans elle, rien n'est activé.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Carte de suivi de livraison (acheteur)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
