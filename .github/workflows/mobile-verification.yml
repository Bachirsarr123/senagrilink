name: Vérification APK release (sans publication)

# Construit l'APK release d'une branche de travail et contrôle le manifeste
# FUSIONNÉ réellement embarqué dans l'APK (pas seulement le fichier source).
# Contrairement à mobile-apk.yml, ce workflow ne publie rien : il ne remplace
# pas la release « mobile-latest » ; l'APK n'est conservé que comme artefact
# privé du dépôt, 7 jours.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'fix/**', 'feat/**']
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-verification.yml'

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Même action et même SDK que mobile-apk.yml (épinglés).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7

      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release

      - name: Permissions du manifeste fusionné de l'APK release
        run: |
          OUTILS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$OUTILS/aapt2" dump permissions "$APK" | tee permissions.txt
          grep -qE "uses-permission.*'android\.permission\.INTERNET'" permissions.txt \
            || { echo "::error::android.permission.INTERNET absente de l'APK release"; exit 1; }
          echo "OK : android.permission.INTERNET présente dans le manifeste fusionné de l'APK release."

      - name: Certificat de signature (information, aucune signature ajoutée)
        run: |
          OUTILS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$OUTILS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n '1,4p'

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-verification
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
