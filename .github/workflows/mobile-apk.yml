name: Build Android APK (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Action tierce épinglée sur un commit immuable (Sonar githubactions:S7637) :
      # un tag comme « v2 » peut être déplacé vers du code différent.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # SDK figé : celui qui a résolu pubspec.lock (les paquets du SDK en dépendent)
          flutter-version: 3.47.7

      # Versions exactes de pubspec.lock, sans résolution à la volée (Sonar githubactions:S8550)
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release

      - name: Publish rolling release with the APK
        run: |
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "SenAgriLink mobile — dernière build de test" \
            --notes "Build automatique depuis le commit ${{ github.sha }}. Pointe vers le backend public (senagrilink-backend.onrender.com). À installer manuellement (source inconnue à autoriser sur Android)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
