  <meta charset="utf-8">
  <title>SenAgriLink</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d6a4f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Application installable (« Ajouter à l'écran d'accueil ») : ouverte en mode
       autonome, elle dispose de son propre stockage, conservé par le système.
       Sans manifeste, iOS crée un simple signet Safari dont le stockage local est
       effacé après 7 jours sans visite (prévention du pistage), ce qui supprimait
       la session. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SenAgriLink">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

</body>
</html>
